<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Outreach sent log</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e3e7ec;--acc:#2456d8}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:12px;align-items:center}
h1{font-size:18px;margin:0 auto 0 0}main{max-width:1000px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
button,input{font:inherit;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px}button{cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat b{display:block;font-size:24px}.stat span{color:var(--mute);font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}th{background:#fafbfc;color:var(--mute)}
h3{margin:18px 0 6px}.meta{color:var(--mute);font-size:13px}code{background:#eef1f5;padding:1px 5px;border-radius:4px}.hidden{display:none!important}
#setup{max-width:560px;margin:60px auto}#setup input{width:100%;margin:8px 0}
</style></head><body>
<div id="setup" class="card hidden"><h2 style="margin-top:0">Connect</h2>
 <p>One-time setup. The token stays in this browser and is only sent to GitHub.</p>
 <ol><li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → New fine-grained token</a>.</li>
 <li>Name <code>outreach-log</code>. Repository access: only <code>outreach-emailer</code>. Permission: <b>Contents: Read-only</b>.</li><li>Paste it here.</li></ol>
 <input id="tok" type="password" placeholder="github_pat_..." autocomplete="off"><button class="p" id="save">Save and open</button>
 <div id="err" class="meta" style="color:#b42318"></div></div>
<div id="app" class="hidden"><header><h1>Outreach: emails sent</h1><input id="q" placeholder="Search name, org, email…"><button id="refresh">Refresh</button><button id="logout">Sign out</button></header>
<main><div class="stats" id="stats"></div><div id="list"></div></main></div>
<script>
const URL_="https://api.github.com/repos/j4dhav/outreach-emailer/contents/claude-outreach/sent.json?ref=main";
const $=s=>document.querySelector(s);let L=[];
const tok=()=>{try{return localStorage.getItem("oe_tok")||""}catch(e){return window._t||""}};
const setTok=v=>{try{localStorage.setItem("oe_tok",v)}catch(e){window._t=v}};
const TZ="America/Chicago";
const day=t=>new Date(t).toLocaleDateString("en-CA",{timeZone:TZ});
const time=t=>new Date(t).toLocaleTimeString("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"});
function el(tag,a={},...k){const e=document.createElement(tag);for(const[x,v]of Object.entries(a))e.setAttribute(x,v);for(const c of k.flat())e.append(c&&c.nodeType?c:document.createTextNode(c==null?"":c));return e}
async function load(){const r=await fetch(URL_+"&t="+Date.now(),{headers:{Authorization:"Bearer "+tok(),Accept:"application/vnd.github.raw+json"}});
 if(r.status===401||r.status===403)throw new Error("Token rejected. It needs Contents: Read-only on outreach-emailer.");if(!r.ok)throw new Error("GitHub error "+r.status);L=await r.json()}
function paint(){const f=$("#q").value.toLowerCase();
 const rows=[...L].filter(x=>!f||JSON.stringify(x).toLowerCase().includes(f)).sort((a,b)=>new Date(b.sent_at)-new Date(a.sent_at));
 const today=day(new Date()),days=new Set(L.map(x=>day(x.sent_at)));
 const st=[["Total sent",L.length],["Sent today",L.filter(x=>day(x.sent_at)===today).length],["Days active",days.size],["Organizations",new Set(L.map(x=>x.org)).size]];
 $("#stats").replaceChildren(...st.map(([k,v])=>el("div",{class:"card stat"},el("b",{},String(v)),el("span",{},k))));
 const by={};rows.forEach(x=>(by[day(x.sent_at)]??=[]).push(x));const out=[];
 for(const d of Object.keys(by)){out.push(el("h3",{},d+"  ·  "+by[d].length+" sent"),
  el("table",{},el("tr",{},...["Time (Central)","To","Organization","Subject","Type"].map(h=>el("th",{},h))),
   ...by[d].map(x=>el("tr",{},el("td",{},time(x.sent_at)),el("td",{},(x.name||"")+" <"+x.email+">"),el("td",{},x.org||""),el("td",{},x.subject||""),el("td",{},x.type||"first")))))}
 if(!out.length)out.push(el("div",{class:"card meta"},L.length?"No matches.":"No emails sent yet."));$("#list").replaceChildren(...out)}
async function refresh(){try{await load();paint()}catch(e){alert(e.message)}}
function show(){const h=!!tok();$("#setup").classList.toggle("hidden",h);$("#app").classList.toggle("hidden",!h);if(h)refresh()}
$("#save").onclick=async()=>{const v=$("#tok").value.trim();if(!v)return;setTok(v);try{await load();show()}catch(e){setTok("");$("#err").textContent=e.message}};
$("#logout").onclick=()=>{setTok("");location.reload()};$("#refresh").onclick=refresh;$("#q").oninput=paint;show();
</script></body></html>
